name: Gesso
options:
  bundleIdPrefix: quest.elsewhere
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  Gesso:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes: [Info.plist]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Gesso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: Gesso saves a new copy of your edited photo to Photos.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: Ground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: quest.elsewhere.gesso
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Bundle offline web editor
        script: '"$SRCROOT/scripts/copy-web.sh"'
        basedOnDependencyAnalysis: false
  GessoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Gesso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: quest.elsewhere.gesso.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gesso:
    build:
      targets:
        Gesso: all
        GessoTests: [test]
    test:
      targets: [GessoTests]
      gatherCoverageData: false
