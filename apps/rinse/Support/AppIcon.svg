<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fdde6"/>
      <stop offset="0.55" stop-color="#2aa5bd"/>
      <stop offset="1" stop-color="#136f8c"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff6fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#06303d" flood-opacity="0.32"/>
    </filter>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a4a5e" flood-opacity="0.38"/>
    </filter>
  </defs>
  <!-- The macOS icon tile: 824 square on a 1024 canvas. -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <!-- Ripples under the drop. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M300 742 Q512 800 724 742" stroke-width="18" stroke-opacity="0.55"/>
    <path d="M372 806 Q512 842 652 806" stroke-width="16" stroke-opacity="0.32"/>
  </g>
  <!-- The drop. -->
  <g filter="url(#dropShadow)">
    <path d="M512 214 C512 214 352 420 352 540 A160 160 0 0 0 672 540 C672 420 512 214 512 214 Z" fill="url(#drop)"/>
  </g>
  <path d="M424 548 A92 92 0 0 0 500 640" fill="none" stroke="#2aa5bd" stroke-opacity="0.45" stroke-width="20" stroke-linecap="round"/>
</svg>
