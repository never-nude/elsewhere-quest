name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add TextLock app at /textlock/
        run: |
          mkdir -p dist/textlock
          cp -r apps/textlock/. dist/textlock/
          rm -rf dist/textlock/test dist/textlock/package.json
      - name: Add Gesso app at /gesso/
        run: |
          mkdir -p dist/gesso
          cp -r apps/gesso/. dist/gesso/
          rm -rf dist/gesso/test dist/gesso/e2e dist/gesso/package.json dist/gesso/SPEC.md dist/gesso/design dist/gesso/ios
          # A new shell cache name whenever any Gesso file changes: the service worker
          # then installs the whole shell again, in one piece, and retires the old one.
          HASH=$(cd dist/gesso && find . -type f ! -name sw.js -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          sed -i -E "s/^const CACHE = 'gesso-[^']*';/const CACHE = 'gesso-${HASH}';/" dist/gesso/sw.js
          grep -q "^const CACHE = 'gesso-${HASH}';" dist/gesso/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
