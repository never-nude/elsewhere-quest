name: Wash CI

on:
  push:
    branches: [main]
    paths: ['apps/rinse/**', '.github/workflows/rinse-ci.yml']
  pull_request:
    paths: ['apps/rinse/**', '.github/workflows/rinse-ci.yml']

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/rinse
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: ./scripts/build-app.sh
      - name: Verify and launch Wash
        run: |
          app="$PWD/build/Wash.app"
          codesign --verify --strict --verbose=2 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")" = Wash
          open -n "$app"
          trap 'pkill -x Wash || true' EXIT
          for attempt in {1..15}; do
            if pgrep -x Wash >/dev/null; then break; fi
            sleep 1
          done
          sleep 3
          pgrep -x Wash
      - name: Package the tested app
        run: ditto -c -k --keepParent build/Wash.app build/Wash-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Wash-macOS
          path: apps/rinse/build/Wash-macOS.zip
          if-no-files-found: error
